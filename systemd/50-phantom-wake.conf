[Service]
# Sunshine's KMS capture finds no display while the screens are blanked and then stays broken
# until restarted; light the screens before it starts (also on restarts while locked).
ExecStartPre=-/usr/bin/busctl --user set-property org.gnome.Mutter.DisplayConfig /org/gnome/Mutter/DisplayConfig org.gnome.Mutter.DisplayConfig PowerSaveMode i 0
ExecStartPre=/bin/sleep 2
